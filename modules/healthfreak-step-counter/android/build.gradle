plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.healthfreak.stepcounter'
version = '1.0.0'

android {
  namespace "com.healthfreak.stepcounter"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.12.0"
}
