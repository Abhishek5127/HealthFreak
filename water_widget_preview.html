<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Bottle Desktop Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 35% 30%, #1a3324 0%, #0d1a12 40%, #060b08 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .bg-orb-1 {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(74, 184, 122, 0.22) 0%, transparent 70%);
      top: 30%;
      left: 36%;
      filter: blur(40px);
      pointer-events: none;
    }

    .bg-orb-2 {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(42, 142, 222, 0.2) 0%, transparent 70%);
      bottom: 30%;
      right: 36%;
      filter: blur(35px);
      pointer-events: none;
    }

    /* ==========================================================
       SUPER GLASSY BORDERLESS WIDGET BOX (2x Compact Size)
       ========================================================== */
    .glass-widget-box {
      width: 72px;
      height: 98px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 38%, rgba(10, 28, 18, 0.42) 100%);
      backdrop-filter: blur(28px) saturate(220%);
      -webkit-backdrop-filter: blur(28px) saturate(220%);
      border-radius: 18px;
      border: none;
      outline: none;
      box-shadow: 
        0 18px 42px rgba(0, 0, 0, 0.55),
        0 4px 12px rgba(0, 0, 0, 0.3),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.4),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
      z-index: 2;
    }

    .glass-widget-box:hover {
      box-shadow: 
        0 20px 48px rgba(0, 0, 0, 0.65),
        0 0 24px rgba(74, 184, 122, 0.22),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.5);
    }

    .glass-widget-box:active {
      transform: scale(0.95);
    }

    .glass-widget-box.goal-met {
      box-shadow: 
        0 18px 42px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(74, 184, 122, 0.35),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
    }

    /* Bottle Container (1.5x Smaller: 52px x 81px) */
    .bottle-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 81px;
    }

    .bottle-svg {
      width: 52px;
      height: 81px;
      display: block;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
    }

    .squish {
      animation: bottleBounce 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bottleBounce {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.06, 0.9); }
      60% { transform: scale(0.96, 1.04); }
      80% { transform: scale(1.01, 0.99); }
      100% { transform: scale(1, 1); }
    }

    /* ==========================================================
       SMOOTH & AESTHETIC FLOATING TEXT (+150ml)
       Pure, clean typography with soft luminous vapor fade
       ========================================================== */
    .popup-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .floating-text {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.2px;
      /* Refined specular luminous glow */
      text-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.7),
        0 0 16px rgba(122, 211, 250, 0.65),
        0 0 4px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      white-space: nowrap;
      animation: smoothFloat 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    @keyframes smoothFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -20%) scale(0.88);
        filter: blur(2px);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -45%) scale(1);
        filter: blur(0px);
      }
      70% {
        opacity: 0.95;
        transform: translate(-50%, -85%) scale(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -115%) scale(0.96);
        filter: blur(1.5px);
      }
    }
  </style>
</head>
<body>

  <div class="bg-orb-1"></div>
  <div class="bg-orb-2"></div>

  <!-- GLASSMORPHISM DESKTOP WIDGET BOX -->
  <div id="widgetBox" class="glass-widget-box" title="Click to drink water (+150ml) • Right-click to reset">
    <div id="bottleContainer" class="bottle-wrapper"></div>
    <div id="popupContainer" class="popup-container"></div>
  </div>

  <script>
    let waterLoggedMl = 0; // Starts empty with sad expression
    const addAmountMl = 150; // Default 150ml per click
    const targetMl = 3000;   // Target goal

    const widgetBox = document.getElementById('widgetBox');
    const bottleContainer = document.getElementById('bottleContainer');
    const popupContainer = document.getElementById('popupContainer');

    /**
     * Generates dynamic bottle SVG with facial expressions evolving at each bar:
     * - < 15%: Sad / Dehydrated 🥺
     * - Bar 1 (~15% - 44%): Neutral / Sipping 😐
     * - Bar 2 (~45% - 74%): Gentle Half-Smile 🙂
     * - Bar 3 (~75% - 99%): Big Cheerful Grin 😄
     * - 100%+ Goal Bar: Radiant Ecstatic Smile 🥰✨
     */
    function generateBottleSvg(fillPercentage) {
      const isGoalReached = fillPercentage >= 100;
      const clampedPercent = Math.min(Math.max(fillPercentage, 0), 100);

      // Bottle Geometry
      const bottleTopY = 38;
      const bottleBottomY = 188;
      const bottleHeight = bottleBottomY - bottleTopY; // 150
      const liquidHeight = (clampedPercent / 100) * bottleHeight;
      const liquidTopY = bottleBottomY - liquidHeight;

      const bottleInnerPath = `
        M 44,38
        L 76,38
        C 80,38 84,42 85,47
        L 94,65
        C 98,72 98,78 98,85
        L 98,176
        C 98,184 91,188 83,188
        L 37,188
        C 29,188 22,184 22,176
        L 22,85
        C 22,78 22,72 26,65
        L 35,47
        C 36,42 40,38 44,38
        Z
      `;

      let faceSvg = '';

      if (clampedPercent < 15) {
        // --- LEVEL 0: SAD / THIRSTY BOTTLE (< 15%) ---
        faceSvg = `
          <g id="faceSad" transform="translate(0, 10)">
            <!-- Droopy sad eyebrows -->
            <path d="M 44,103 Q 48,107 53,105" stroke="#1C384E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />
            <path d="M 67,105 Q 72,107 76,103" stroke="#1C384E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />
            <!-- Droopy sad eyes -->
            <circle cx="48" cy="110" r="3" fill="#1C384E" />
            <circle cx="72" cy="110" r="3" fill="#1C384E" />
            <!-- Sad downturned mouth -->
            <path d="M 53,124 Q 60,117 67,124" stroke="#1C384E" stroke-width="2.8" stroke-linecap="round" fill="none" />
            <!-- Tiny sad dehydration tear drop -->
            <path d="M 76,113 C 74,116 74,119 76,120 C 78,119 78,116 76,113 Z" fill="#64B5F6" opacity="0.9" />
          </g>
        `;
      } else if (clampedPercent < 45) {
        // --- LEVEL 1: REACHING BAR 1 (15% - 44%) ---
        faceSvg = `
          <g id="faceNeutral" transform="translate(0, 8)" opacity="0.75">
            <circle cx="48" cy="109" r="3" fill="#1C384E" />
            <circle cx="72" cy="109" r="3" fill="#1C384E" />
            <line x1="55" y1="120" x2="65" y2="120" stroke="#1C384E" stroke-width="2.5" stroke-linecap="round" />
          </g>
        `;
      } else if (clampedPercent < 75) {
        // --- LEVEL 2: REACHING BAR 2 (45% - 74%) ---
        faceSvg = `
          <g id="faceHalfSmile" transform="translate(0, 9)">
            <circle cx="48" cy="108" r="3.2" fill="#1C384E" />
            <circle cx="72" cy="108" r="3.2" fill="#1C384E" />
            <circle cx="41" cy="114" r="3.5" fill="#FF8BA7" opacity="0.5" />
            <circle cx="79" cy="114" r="3.5" fill="#FF8BA7" opacity="0.5" />
            <path d="M 53,118 Q 60,126 67,118" stroke="#1C384E" stroke-width="2.6" stroke-linecap="round" fill="none" />
          </g>
        `;
      } else if (clampedPercent < 100) {
        // --- LEVEL 3: REACHING BAR 3 (75% - 99%) ---
        faceSvg = `
          <g id="faceBigGrin" transform="translate(0, 9)">
            <path d="M 44,106 Q 49,99 54,106" stroke="#0D2E49" stroke-width="3" stroke-linecap="round" fill="none" />
            <path d="M 66,106 Q 71,99 76,106" stroke="#0D2E49" stroke-width="3" stroke-linecap="round" fill="none" />
            <circle cx="40" cy="113" r="4.2" fill="#FF8BA7" opacity="0.75" />
            <circle cx="80" cy="113" r="4.2" fill="#FF8BA7" opacity="0.75" />
            <path d="M 50,115 Q 60,131 70,115 Z" fill="#0D2E49" />
            <path d="M 54,122 Q 60,130 66,122 Z" fill="#FF6B8B" />
          </g>
        `;
      } else {
        // --- LEVEL 4: GOAL ACHIEVED (100%+) ---
        faceSvg = `
          <g id="faceEcstatic" transform="translate(0, 9)">
            <path d="M 43,105 Q 49,97 55,105" stroke="#0D2E49" stroke-width="3.6" stroke-linecap="round" fill="none" />
            <path d="M 65,105 Q 71,97 77,105" stroke="#0D2E49" stroke-width="3.6" stroke-linecap="round" fill="none" />
            <circle cx="39" cy="113" r="4.8" fill="#FF8BA7" opacity="0.9" />
            <circle cx="81" cy="113" r="4.8" fill="#FF8BA7" opacity="0.9" />
            <path d="M 48,114 Q 60,134 72,114 Z" fill="#0D2E49" />
            <path d="M 53,123 Q 60,133 67,123 Z" fill="#FF6B8B" />
            <polygon points="35,32 37,37 42,37 38,40 39,45 35,42 31,45 32,40 28,37 33,37" fill="#FFD166" opacity="0.95" />
            <polygon points="85,32 87,37 92,37 88,40 89,45 85,42 81,45 82,40 78,37 83,37" fill="#FFD166" opacity="0.95" />
          </g>
        `;
      }

      // Dynamic surface wave
      const wave = clampedPercent > 0 && clampedPercent < 100
        ? `
          <path d="
            M 15,${liquidTopY + 2}
            Q 35,${liquidTopY - 4} 60,${liquidTopY}
            Q 85,${liquidTopY + 4} 105,${liquidTopY - 1}
            L 105,${liquidTopY + 14}
            L 15,${liquidTopY + 14}
            Z
          " fill="#98E1FD" opacity="0.85" />
        `
        : '';

      return `
        <svg class="bottle-svg" viewBox="0 0 120 200">
          <defs>
            <linearGradient id="wGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#7AD3FA" />
              <stop offset="35%" stop-color="#4FA3E2" />
              <stop offset="100%" stop-color="#256EB3" />
            </linearGradient>
            <clipPath id="bClip">
              <path d="${bottleInnerPath}" />
            </clipPath>
          </defs>

          <!-- Bottle Outer Glass Silhouette -->
          <path d="${bottleInnerPath}" fill="#142018" stroke="#2D4233" stroke-width="3.5" />

          <!-- Clipped Water Fill & Expressions -->
          <g clip-path="url(#bClip)">
            <rect x="10" y="${liquidTopY}" width="100" height="${liquidHeight + 25}" fill="url(#wGrad)" />
            ${wave}
            ${faceSvg}
          </g>

          <!-- Cap Collar & Thread -->
          <rect x="42" y="27" width="36" height="11" rx="3" fill="#3D4B40" stroke="#546558" stroke-width="1.5" />
          <rect x="47" y="15" width="26" height="12" rx="4" fill="#2B362E" stroke="#546558" stroke-width="1.5" />
          <!-- Cap Loop Handle -->
          <path d="M 54,15 C 54,8 66,8 66,15" stroke="#546558" stroke-width="3" fill="none" stroke-linecap="round" />

          <!-- Graduation Bar Ticks -->
          <!-- Bar 1 (Bottom): Y=140 -->
          <line x1="26" y1="140" x2="36" y2="140" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" />
          <!-- Bar 2 (Middle): Y=100 -->
          <line x1="26" y1="100" x2="39" y2="100" stroke="#FFFFFF" stroke-width="2.2" opacity="0.55" />
          <!-- Bar 3 (Top): Y=65 -->
          <line x1="26" y1="65" x2="36" y2="65" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" />
        </svg>
      `;
    }

    function render() {
      const percentage = Math.round((waterLoggedMl / targetMl) * 100);
      const isGoalMet = waterLoggedMl >= targetMl;

      bottleContainer.innerHTML = generateBottleSvg(percentage);

      if (isGoalMet) {
        widgetBox.classList.add('goal-met');
      } else {
        widgetBox.classList.remove('goal-met');
      }
    }

    /**
     * Spawns a smooth, aesthetic floating text element (no clunky pill box, no emojis).
     * Floats upward smoothly with cubic-bezier easing and graceful vapor fade.
     */
    function spawnAestheticText(amount) {
      const textElem = document.createElement('div');
      textElem.className = 'floating-text';
      textElem.textContent = `+${amount}ml`;
      popupContainer.appendChild(textElem);

      setTimeout(() => {
        textElem.remove();
      }, 700);
    }

    function triggerSquish() {
      const svg = bottleContainer.querySelector('.bottle-svg');
      if (svg) {
        svg.classList.remove('squish');
        void svg.offsetWidth; // Force CSS reflow
        svg.classList.add('squish');
      }
    }

    // Left-Click: Add 150ml, squish bottle, float aesthetic text, update expression
    widgetBox.addEventListener('click', () => {
      waterLoggedMl += addAmountMl;
      triggerSquish();
      spawnAestheticText(addAmountMl);
      render();
    });

    // Right-Click: Reset back to 0ml to test from the sad empty state again!
    widgetBox.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      waterLoggedMl = 0;
      triggerSquish();
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
