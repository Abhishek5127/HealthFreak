<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Bottle Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0d120f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Minimalist Desktop Widget Box */
    .widget-box {
      width: 140px;
      height: 160px;
      background: #121915;
      border-radius: 24px;
      border: 1.5px solid #243429;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .widget-box:hover {
      border-color: #385240;
    }

    .widget-box:active {
      transform: scale(0.96);
    }

    .widget-box.goal-met {
      border-color: #386644;
      box-shadow: 0 12px 35px rgba(74, 184, 122, 0.22);
    }

    /* Bottle SVG */
    .bottle-svg {
      width: 75px;
      height: 120px;
      display: block;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
    }

    .widget-box:active .bottle-svg {
      transform: scale(0.92);
    }

    /* Floating ml pop-up (only appears when clicked, then disappears) */
    .pop-ml {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(38, 119, 180, 0.95);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
    }

    .pop-ml.animate {
      animation: popFade 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popFade {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.8);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.95);
      }
    }
  </style>
</head>
<body>

  <!-- Clean Widget Box (Right-click to reset) -->
  <div id="widgetBox" class="widget-box" title="Click to add water • Right-click to reset">
    <div id="bottleContainer"></div>
    <div id="popMl" class="pop-ml">+150ml</div>
  </div>

  <script>
    let waterLoggedMl = 0;
    const addAmountMl = 150; // Default amount per click (configurable via app)
    const targetMl = 3000;

    const widgetBox = document.getElementById('widgetBox');
    const bottleContainer = document.getElementById('bottleContainer');
    const popMl = document.getElementById('popMl');

    function generateBottleSvg(fillPercentage) {
      const isGoalReached = fillPercentage >= 100;
      const clampedPercent = Math.min(Math.max(fillPercentage, 0), 100);

      // Geometry for viewBox 0 0 120 200
      const bottleTopY = 38;
      const bottleBottomY = 188;
      const bottleHeight = bottleBottomY - bottleTopY; // 150
      const liquidHeight = (clampedPercent / 100) * bottleHeight;
      const liquidTopY = bottleBottomY - liquidHeight;

      const bottleInnerPath = `
        M 44,38
        L 76,38
        C 80,38 84,42 85,47
        L 94,65
        C 98,72 98,78 98,85
        L 98,176
        C 98,184 91,188 83,188
        L 37,188
        C 29,188 22,184 22,176
        L 22,85
        C 22,78 22,72 26,65
        L 35,47
        C 36,42 40,38 44,38
        Z
      `;

      // Smiling face appears when goal is met
      const face = isGoalReached
        ? `
          <g transform="translate(0, 10)">
            <path d="M 43,105 Q 49,97 55,105" stroke="#0D2E49" stroke-width="3.5" stroke-linecap="round" fill="none" />
            <path d="M 65,105 Q 71,97 77,105" stroke="#0D2E49" stroke-width="3.5" stroke-linecap="round" fill="none" />
            <circle cx="39" cy="113" r="4.5" fill="#FF8BA7" opacity="0.85" />
            <circle cx="81" cy="113" r="4.5" fill="#FF8BA7" opacity="0.85" />
            <path d="M 48,114 Q 60,134 72,114 Z" fill="#0D2E49" />
            <path d="M 53,123 Q 60,133 67,123 Z" fill="#FF6B8B" />
          </g>
        `
        : `
          <g transform="translate(0, 8)" opacity="${clampedPercent > 30 ? '0.75' : '0.4'}">
            <circle cx="48" cy="108" r="3" fill="#1C384E" />
            <circle cx="72" cy="108" r="3" fill="#1C384E" />
            <path d="M 54,118 Q 60,123 66,118" stroke="#1C384E" stroke-width="2.5" stroke-linecap="round" fill="none" />
          </g>
        `;

      const wave = clampedPercent > 0 && clampedPercent < 100
        ? `
          <path d="
            M 15,${liquidTopY + 2}
            Q 35,${liquidTopY - 4} 60,${liquidTopY}
            Q 85,${liquidTopY + 4} 105,${liquidTopY - 1}
            L 105,${liquidTopY + 12}
            L 15,${liquidTopY + 12}
            Z
          " fill="#98E1FD" opacity="0.85" />
        `
        : '';

      return `
        <svg class="bottle-svg" viewBox="0 0 120 200">
          <defs>
            <linearGradient id="wGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#7AD3FA" />
              <stop offset="40%" stop-color="#4FA3E2" />
              <stop offset="100%" stop-color="#256EB3" />
            </linearGradient>
            <clipPath id="bClip">
              <path d="${bottleInnerPath}" />
            </clipPath>
          </defs>

          <!-- Bottle Body -->
          <path d="${bottleInnerPath}" fill="#142018" stroke="#2D4233" stroke-width="3.5" />

          <!-- Clipped Water -->
          <g clip-path="url(#bClip)">
            <rect x="10" y="${liquidTopY}" width="100" height="${liquidHeight + 25}" fill="url(#wGrad)" />
            ${wave}
            ${face}
          </g>

          <!-- Cap & Handle -->
          <rect x="42" y="27" width="36" height="11" rx="3" fill="#3D4B40" stroke="#546558" stroke-width="1.5" />
          <rect x="47" y="15" width="26" height="12" rx="4" fill="#2B362E" stroke="#546558" stroke-width="1.5" />
          <path d="M 54,15 C 54,8 66,8 66,15" stroke="#546558" stroke-width="3" fill="none" stroke-linecap="round" />

          <!-- Measurement Ticks -->
          <line x1="26" y1="140" x2="35" y2="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />
          <line x1="26" y1="100" x2="38" y2="100" stroke="#FFFFFF" stroke-width="2" opacity="0.45" />
          <line x1="26" y1="65" x2="35" y2="65" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />
        </svg>
      `;
    }

    function render() {
      const percentage = Math.round((waterLoggedMl / targetMl) * 100);
      const isGoalMet = waterLoggedMl >= targetMl;

      bottleContainer.innerHTML = generateBottleSvg(percentage);

      if (isGoalMet) {
        widgetBox.classList.add('goal-met');
      } else {
        widgetBox.classList.remove('goal-met');
      }
    }

    function triggerPop(amount) {
      popMl.textContent = `+${amount}ml`;
      popMl.classList.remove('animate');
      void popMl.offsetWidth; // Force CSS reflow
      popMl.classList.add('animate');
    }

    // Left-click adds 150ml and pops up text that disappears
    widgetBox.addEventListener('click', () => {
      waterLoggedMl += addAmountMl;
      triggerPop(addAmountMl);
      render();
    });

    // Right-click resets water (for testing convenience)
    widgetBox.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      waterLoggedMl = 0;
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
